<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Account | Epinoia Horizon</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/store.css?v=4">
  <style>
    .account{max-width:980px;margin:0 auto;padding:6.4rem 1.2rem 4rem;display:grid;gap:1.2rem}
    .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#22d3ee}
    h1{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:#facc15;margin:.4rem 0 .2rem}
    .panel{background:rgba(10,7,24,.72);border:1px solid rgba(234,179,8,.22);border-radius:18px;padding:1.3rem}
    .panel h2{font-family:Cinzel,serif;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:#facc15;margin:0 0 .8rem}
    .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.05rem;border-radius:999px;border:1px solid rgba(234,179,8,.45);
      background:linear-gradient(135deg,#eab308,#ca8a04);color:#0b0810;font-family:Cinzel,serif;font-weight:700;font-size:.7rem;
      letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
    .btn.ghost{background:transparent;color:#a5f3fc;border-color:rgba(34,211,238,.4)}
    .grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:1.2rem}
    @media(max-width:760px){.grid2{grid-template-columns:1fr}}
    dl{margin:0;display:grid;gap:.55rem}
    .kv{display:flex;justify-content:space-between;gap:1rem;font-size:.82rem}
    .kv dt{color:#8a8d94;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
    .kv dd{margin:0;color:#ededef}
    .pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;
      border-radius:999px;padding:.14rem .5rem;border:1px solid rgba(148,163,184,.3);color:#8a8d94}
    .pill.ok{border-color:rgba(74,222,128,.4);color:#86efac}
    .order{border:1px solid rgba(148,163,184,.14);border-radius:12px;padding:.8rem .9rem;margin-bottom:.6rem;background:rgba(6,4,13,.55)}
    .order .top{display:flex;justify-content:space-between;gap:1rem;font-size:.8rem}
    .order .items{font-size:.72rem;color:#8a8d94;margin-top:.35rem;line-height:1.5}
    .empty{color:#8a8d94;font-size:.85rem;line-height:1.6;margin:0}
    .empty a{color:#22d3ee}
    .mono{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:#8a8d94;word-break:break-all}
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <div class="brand-icon"><i class="fas fa-eye"></i></div>
      <div class="brand-text">
        <span class="brand-name">EPINOIA HORIZON</span>
        <span class="brand-sub">Account</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="/store/" class="nav-link">Store</a>
      <a href="/store/studio.html" class="nav-link">Studio</a>
      <a href="/store/creator.html" class="nav-link">Atelier</a>
    </nav>
    <div class="header-actions" id="eh-account-host"></div>
  </div>
</header>

<main class="account">
  <div>
    <div class="eyebrow"><i class="fas fa-user-shield"></i> Buyer</div>
    <h1>Your account</h1>
  </div>
  <div id="view"></div>
</main>

<script src="/assets/account.js"></script>
<script>
(function () {
  const host = document.getElementById('eh-account-host');
  const view = document.getElementById('view');

  function money(cents) {
    return '$' + (Number(cents) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  const user = window.EpinoiaAccount.current();

  if (!user) {
    host.innerHTML = '<a class="btn ghost" href="/store/"><i class="fas fa-right-to-bracket"></i> Sign in</a>';
    view.innerHTML =
      '<div class="panel"><h2>Not signed in</h2><p class="empty">Sign in from the store to see your orders and listings.</p>' +
      '<p style="margin-top:1rem"><a class="btn" href="/store/"><i class="fas fa-arrow-left"></i> Back to the store</a></p></div>';
    return;
  }

  host.innerHTML =
    '<div class="row"><span class="pill ' + (user.isCreator ? 'ok' : '') + '">' + (user.isCreator ? 'creator' : 'buyer') + '</span>' +
    '<button class="btn ghost" onclick="window.EpinoiaAccount.signOut();location.href=\'/store/\'">Sign out</button></div>';

  const orders = window.EpinoiaAccount.myOrders();
  const products = user.isCreator ? window.EpinoiaAccount.myProducts() : [];

  const orderRows = orders.length
    ? orders.slice().reverse().map(function (o) {
        const items = (o.items || []).map(function (i) { return (i.name || i.title || 'item') + ' × ' + (i.qty || 1); }).join(' · ');
        const when = o.date ? new Date(o.date).toLocaleDateString('en-GB') : '';
        return '<div class="order"><div class="top"><strong>' + (o.id || 'order') + '</strong><span>' + (o.total ? money(o.total) : '') + '</span></div>' +
          '<div class="items">' + (items || 'no line items recorded') + (when ? ' · ' + when : '') + '</div></div>';
      }).join('')
    : '<p class="empty">No orders on this device yet. Orders are recorded in this browser after checkout.</p>';

  view.innerHTML =
    '<div class="grid2">' +
      '<div class="panel"><h2>Orders</h2>' + orderRows + '</div>' +
      '<div style="display:grid;gap:1.2rem">' +
        '<div class="panel"><h2>Profile</h2><dl>' +
          '<div class="kv"><dt>name</dt><dd>' + (user.name || '—') + '</dd></div>' +
          '<div class="kv"><dt>email</dt><dd>' + (user.email || '—') + '</dd></div>' +
          '<div class="kv"><dt>phone</dt><dd>' + (user.phone || '—') + '</dd></div>' +
          '<div class="kv"><dt>account</dt><dd class="mono">' + (user.id || '—') + '</dd></div>' +
          '<div class="kv"><dt>role</dt><dd>' + (user.isCreator ? 'buyer · creator' : 'buyer') + '</dd></div>' +
        '</dl></div>' +
        '<div class="panel"><h2>Creator</h2>' +
          (user.isCreator
            ? '<p class="empty">' + products.length + ' listing' + (products.length === 1 ? '' : 's') + ' signed by you.</p>' +
              '<p style="margin-top:.9rem"><a class="btn" href="/store/creator.html"><i class="fas fa-hammer"></i> Open the atelier</a></p>'
            : '<p class="empty">Sell your own work: your account can hold a key that signs each listing.</p>' +
              '<p style="margin-top:.9rem"><a class="btn" href="/store/creator.html"><i class="fas fa-key"></i> Become a creator</a></p>') +
        '</div>' +
      '</div>' +
    '</div>';
})();
</script>
</body>
</html>
