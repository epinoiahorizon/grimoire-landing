<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details &amp; 3D Inspection | Epinoia Horizon</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/store.css?v=5">
  <!-- Google model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <meta name="robots" content="noindex, follow">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <div class="brand-icon"><i class="fas fa-eye"></i></div>
      <div class="brand-text">
        <span class="brand-name">EPINOIA HORIZON</span>
        <span class="brand-sub">Merlin Arcane Fleet</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="/store/" class="nav-link"><i class="fas fa-arrow-left"></i> Vault Store</a>
      <a href="/app/" class="nav-link">App</a>
      <a href="/pricing/" class="nav-link">Pricing</a>
      <a href="/docs/" class="nav-link">Docs</a>
      <a href="/store/admin.html" id="dev-admin-nav-link" class="nav-link" style="color:var(--gold);display:none;"><i class="fas fa-screwdriver-wrench"></i> Dev Admin</a>
    </nav>
    <div class="header-actions">
      <button class="btn-cart" onclick="window.EpinoiaStore.openCart()">
        <i class="fas fa-shield-halved" style="color:var(--cyan);"></i>
        <span>Vault</span>
        <span class="cart-badge">0</span>
      </button>
    </div>
  </div>
</header>

<main class="store-container">

  <div style="margin-bottom:24px;">
    <a href="/store/" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);display:inline-flex;align-items:center;gap:6px;">
      <i class="fas fa-chevron-left" style="font-size:10px;"></i> Return to Catalog
    </a>
  </div>

  <div id="product-detail-root" class="detail-layout">
    <!-- Populated dynamically via JS -->
  </div>

</main>

<!-- Cart Drawer -->
<div id="cart-overlay" class="cart-overlay" onclick="window.EpinoiaStore.closeCart()"></div>
<div id="cart-drawer" class="cart-drawer">
  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px;">
      <div style="font-family:'Cinzel Decorative',serif;font-size:18px;color:var(--gold);font-weight:700;">
        <i class="fas fa-vault" style="color:var(--cyan);margin-right:8px;"></i> Selected Relics
      </div>
      <button onclick="window.EpinoiaStore.closeCart()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div id="cart-items-list" style="max-height:60vh;overflow-y:auto;padding-right:4px;"></div>
  </div>

  <div style="border-top:1px solid var(--line);padding-top:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <span style="font-family:'Cinzel',serif;font-size:13px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.1em;">Total Valuation</span>
      <span id="cart-total-price" style="font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--gold);font-weight:700;">$0</span>
    </div>
    <button onclick="checkoutWhatsApp()" style="width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#eab308,#ca8a04);border:none;color:#000;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 20px rgba(234,179,8,0.4);display:flex;align-items:center;justify-content:center;gap:10px;">
      <i class="fas fa-lock" style="font-size:15px;"></i> Authorize &amp; Checkout
    </button>
  </div>
</div>

<footer style="position:relative;z-index:10;border-top:1px solid rgba(234,179,8,0.18);background:rgba(3,2,8,0.85);padding:30px 24px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);">
  <p>© 2026 EPINOIA HORIZON INC. ARTISAN ATELIER &amp; HARNESS VAULT.</p>
</footer>

<script src="/assets/account.js"></script>
<script src="/assets/store.js?v=7"></script>
<script>
  let currentProduct = null;

  function loadProduct() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id') || 'merlin-harness';
    currentProduct = window.EpinoiaStore.getProductById(id);
    document.title = `${currentProduct.title} — 3D Specs | Epinoia Horizon`;

    const root = document.getElementById('product-detail-root');
    const specsHtml = currentProduct.specs ? Object.entries(currentProduct.specs).map(([k, v]) => `
      <tr>
        <td>${k}</td>
        <td style="color:#f1f5f9;font-family:'Inter',sans-serif;">${v}</td>
      </tr>
    `).join('') : '';

    root.innerHTML = `
      <div>
        <div class="viewer-container">
          ${currentProduct.has3D && currentProduct.modelUrl ? `
            <span class="badge-3d" style="top:16px;right:16px;"><i class="fas fa-cube"></i> Interactive 3D Spatial View</span>
            <model-viewer
              id="main-viewer"
              src="${currentProduct.modelUrl}"
              alt="${currentProduct.title}"
              auto-rotate
              rotation-per-second="20deg"
              camera-controls
              shadow-intensity="1.5"
              exposure="1.1"
              ar
              ar-modes="webxr scene-viewer quick-look"
              style="background:radial-gradient(circle at center, rgba(30,27,75,0.4) 0%, rgba(3,2,8,0.95) 80%);">
            </model-viewer>
            <div class="viewer-hints">
              <span><i class="fas fa-hand-pointer"></i> Drag to rotate</span>
              <span><i class="fas fa-magnifying-glass-plus"></i> Scroll to zoom</span>
              <span><i class="fas fa-mobile-screen"></i> AR Available</span>
            </div>
          ` : `
            <div style="height:100%;display:grid;place-items:center;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;padding:20px;">
              <div>
                <i class="fas fa-cube" style="font-size:48px;color:var(--gold);margin-bottom:14px;display:block;"></i>
                <span>3D Spatial Model currently being forged in Atelier.</span>
              </div>
            </div>
          `}
        </div>

        <div style="margin-top:16px;display:flex;gap:12px;">
          <button onclick="document.getElementById('main-viewer')?.resetTurntable?.()" style="flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;">
            <i class="fas fa-rotate-right"></i> Reset Angle
          </button>
          <button onclick="toggleAutoRotate()" style="flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;">
            <i class="fas fa-arrows-spin"></i> Toggle Spin
          </button>
        </div>
      </div>

      <div class="detail-info">
        <div>
          <span class="detail-badge">${currentProduct.badge || currentProduct.categoryLabel}</span>
          <h1 class="detail-title">${currentProduct.title}</h1>
          <div class="detail-price">$${currentProduct.price.toLocaleString()} <span style="font-size:13px;color:var(--dim);font-family:'Inter',sans-serif;font-weight:400;">USD</span></div>
          <p class="detail-desc">${currentProduct.fullDesc || currentProduct.shortDesc}</p>
          <div id="prov-block"></div>

          <h3 style="font-family:'Cinzel',serif;font-size:14px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px;">
            <i class="fas fa-list-check" style="color:var(--cyan);margin-right:6px;"></i> Technical &amp; Material Specifications
          </h3>
          <table class="spec-table">
            <tbody>
              ${specsHtml}
            </tbody>
          </table>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;">
          <button onclick="buyCurrent()" style="flex:1;min-width:180px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#eab308,#ca8a04);border:none;color:#000;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 25px rgba(234,179,8,0.45);display:flex;align-items:center;justify-content:center;gap:10px;">
            <i class="fas fa-cart-plus" style="font-size:15px;"></i> Add To Vault
          </button>
          <button onclick="directCheckout()" style="padding:16px 22px;border-radius:14px;background:rgba(8,47,73,0.7);border:1px solid var(--line-c);color:var(--cyan-soft);font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
            <i class="fas fa-file-invoice-dollar"></i> Instant Checkout
          </button>
        </div>
      </div>
    `;
    renderProvenance(currentProduct);
  }

  /**
   * Provenance on the buyer's page: the root the maker computed, the six tributaries it covers, and
   * — when the listing carries one — the maker's signature, re-checked here in this browser rather
   * than trusted because the page says so.
   */
  async function renderProvenance(p) {
    const host = document.getElementById('prov-block');
    if (!host) return;
    const prov = p && p.provenance;
    const sig = p && p.signature;
    if (!prov && !sig) return;

    const facetRows = prov && prov.facets ? Object.entries(prov.facets).map(([k, v]) => `
      <div class="kv"><dt>${k}</dt><dd>${String(v || '—')}</dd></div>`).join('') : '';
    const missing = prov && prov.missing && prov.missing.length ? `<div class="warn">incomplete: ${prov.missing.join(', ')}</div>` : '';

    host.innerHTML = `
      <h3 style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px;">
        <i class="fas fa-fingerprint" style="color:var(--cyan);margin-right:6px;"></i> Provenance
      </h3>
      ${prov && prov.root ? `
        <div class="kv"><dt>dreamball root</dt><dd class="mono" title="${prov.root}">${prov.root}</dd></div>
        <div class="kv"><dt>tributaries</dt><dd>${6 - (prov.missing ? prov.missing.length : 0)}/6</dd></div>` : ''}
      ${facetRows}
      ${missing}
      ${sig ? `
        <div class="kv"><dt>signed by</dt><dd class="mono" title="${sig.did}">${sig.did}</dd></div>
        <button id="btnVerifyProv" class="verify">Verify this listing in my browser</button>
        <div id="verifyOut" class="verify-out"></div>` : `
        <div class="dim" style="margin-top:8px;font-size:12px;color:var(--muted)">This listing is not signed by a maker key.</div>`}
      <style>
        #prov-block .kv{display:flex;gap:10px;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(148,163,184,.08);font-size:12px}
        #prov-block dt{color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-family:'JetBrains Mono',monospace}
        #prov-block dd{margin:0;color:#e2e8f0;max-width:62%;text-align:right}
        #prov-block .mono{font-family:'JetBrains Mono',monospace;font-size:10px;word-break:break-all;color:var(--muted)}
        #prov-block .warn{margin-top:6px;font-size:11px;color:#fde047}
        #prov-block .verify{margin-top:12px;padding:9px 14px;border-radius:999px;border:1px solid rgba(234,179,8,.45);background:transparent;color:var(--gold);font-family:Cinzel,serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
        #prov-block .verify-out{margin-top:8px;font-size:11px;font-family:'JetBrains Mono',monospace}
      </style>`;

    const btn = document.getElementById('btnVerifyProv');
    if (!btn || !sig) return;
    btn.onclick = async function () {
      const out = document.getElementById('verifyOut');
      if (!window.EpinoiaAccount) { out.textContent = 'verifier unavailable'; out.style.color = '#d99a2b'; return; }
      out.textContent = 'checking…'; out.style.color = 'var(--muted)';
      const { signature, ...unsigned } = p;
      const ok = await window.EpinoiaAccount.verify(unsigned, signature);
      out.textContent = ok ? 'signature valid — this is the listing the maker signed' : 'signature BROKEN — the listing was changed after signing';
      out.style.color = ok ? '#86efac' : '#fca5a5';
    };
  }

  function toggleAutoRotate() {
    const viewer = document.getElementById('main-viewer');
    if (viewer) viewer.autoRotate = !viewer.autoRotate;
  }

  function buyCurrent() {
    if (currentProduct) {
      window.EpinoiaStore.addToCart(currentProduct);
    }
  }

  function directCheckout() {
    if (!currentProduct) return;
    window.EpinoiaStore.openSafeCheckout([{ ...currentProduct, qty: 1 }]);
  }

  function checkoutWhatsApp() {
    window.EpinoiaStore.openSafeCheckout();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadProduct);
  } else {
    loadProduct();
  }
</script>
</body>
</html>
