<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Studio publish self-test</title><meta name="robots" content="noindex">
<style>body{background:#0a0812;color:#ededef;font-family:ui-monospace,monospace;padding:1.2rem;line-height:1.55;font-size:.78rem}
h1{font-size:.85rem;color:#facc15;margin:0 0 .7rem}.pass{color:#86efac}.fail{color:#fca5a5}.dim{color:#8a8d94}
iframe{width:1px;height:1px;opacity:0;border:0;position:absolute;left:-9999px}</style></head>
<body>
<h1>Studio → Atelier publish self-test</h1>
<div id="out">running…</div>
<iframe id="studio" src="/store/studio.html?demo"></iframe>

<script src="/assets/account.js"></script>
<script>
(async function () {
  const out = document.getElementById('out');
  const lines = []; let pass = 0, fail = 0;
  const check = (l, c, d) => { if (c) { pass++; lines.push('PASS  ' + l + (d ? '  ' + d : '')); } else { fail++; lines.push('FAIL  ' + l + (d ? '  ' + d : '')); } };

  if (!location.search.includes('run=1')) {
    out.innerHTML = '<div class="dim">inert — add ?run=1 (it clears this browser store account and product list)</div>';
    document.body.dataset.result = 'IDLE'; return;
  }
  ['eh_sanctum_buyer_account','eh_registered_buyers_dir','epinoia_custom_products_v3'].forEach(k => localStorage.removeItem(k));
  const buyer = { id: 'EH-STUDIO-1', name: 'Mark Test', email: 'mark@test.local', phone: '+61 0', password: 'x' };
  localStorage.setItem('eh_registered_buyers_dir', JSON.stringify({ 'mark@test.local': buyer }));
  localStorage.setItem('eh_sanctum_buyer_account', JSON.stringify(buyer));
  const acc = await window.EpinoiaAccount.becomeCreator('mark-maker');
  check('creator ready', acc.roles.includes('creator'), acc.did.slice(0, 22) + '…');

  const frame = document.getElementById('studio');
  const waitFor = (fn, ms) => new Promise((res, rej) => {
    const t0 = Date.now();
    (function poll() {
      let v; try { v = fn(); } catch (e) { v = null; }
      if (v) return res(v);
      if (Date.now() - t0 > ms) return rej(new Error('timeout'));
      setTimeout(poll, 150);
    })();
  });

  try {
    const root = await waitFor(() => {
      const d = frame.contentDocument;
      const el = d && d.getElementById('root');
      return el && el.textContent && el.textContent.startsWith('0x') ? el.textContent.trim() : null;
    }, 12000);
    check('studio computed a root from the demo', /^0x[0-9a-f]{64}$/.test(root), root.slice(0, 18) + '…');

    const win = frame.contentWindow;
    check('publish hook exposed', typeof win.__studioPublish === 'function');
    await win.__studioPublish();

    const list = JSON.parse(localStorage.getItem('epinoia_custom_products_v3') || '[]');
    check('listing landed in this account', list.length === 1, 'count=' + list.length);
    const p = list[0] || {};
    check('listing carries the provenance root', p.provenance && p.provenance.root === root, (p.provenance || {}).root ? 'matches studio' : 'missing');
    check('listing records its owner', p.owner === 'EH-STUDIO-1', p.owner);
    check('listing has a signature', !!(p.signature && p.signature.signature), p.signature ? p.signature.did.slice(0, 22) + '…' : 'none');

    const { signature, ...unsigned } = p;
    const ok = await window.EpinoiaAccount.verify(unsigned, signature);
    check('signature verifies against the listing', ok === true);
    const tampered = { ...unsigned, price: (unsigned.price || 0) + 1 };
    check('changing the price breaks it', (await window.EpinoiaAccount.verify(tampered, signature)) === false);

    const mine = window.EpinoiaAccount.myProducts();
    check('atelier sees it as mine', mine.length === 1 && mine[0].id === p.id, mine[0] && mine[0].id);
  } catch (e) {
    check('flow completed', false, e.message);
  }

  out.innerHTML = lines.map(l => '<div class="' + (l.startsWith('PASS') ? 'pass' : 'fail') + '">' + l.replace(/</g,'&lt;') + '</div>').join('')
    + '<div class="' + (fail ? 'fail' : 'dim') + '" style="margin-top:.6rem">' + pass + ' passed, ' + fail + ' failed</div>';
  document.body.dataset.result = fail ? 'FAIL' : 'PASS';
})();
</script>
</body></html>
