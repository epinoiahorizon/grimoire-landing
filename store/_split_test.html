<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Split self-test</title><meta name="robots" content="noindex">
<style>body{background:#0a0812;color:#ededef;font-family:ui-monospace,monospace;padding:1.2rem;line-height:1.55;font-size:.76rem}
h1{font-size:.85rem;color:#facc15;margin:0 0 .7rem}.pass{color:#86efac}.fail{color:#fca5a5}.dim{color:#8a8d94}
iframe{width:1px;height:1px;opacity:0;border:0;position:absolute;left:-9999px}</style></head>
<body>
<h1>Split self-test</h1>
<div id="out">running…</div>
<iframe id="rcpt"></iframe>

<script>
window.addEventListener('error', function (e) {
  var o = document.getElementById('out');
  if (o) o.innerHTML = '<div class="fail">ERROR ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '</div>';
  document.body.dataset.result = 'ERROR';
});
window.addEventListener('unhandledrejection', function (e) {
  var o = document.getElementById('out');
  var msg = (e.reason && (e.reason.message || e.reason)) || 'rejected';
  if (o) o.innerHTML = '<div class="fail">REJECTED ' + String(msg).slice(0, 240) + '</div>';
  document.body.dataset.result = 'REJECTED';
});
</script>
<script src="/assets/account.js"></script>
<script type="module">
import { distribute, combine, validateShares, DEFAULT_SPLIT, money } from '/assets/split.js';

const out = document.getElementById('out');
const lines = []; let pass = 0, fail = 0;
const check = (l, c, d) => { if (c) { pass++; lines.push('PASS  ' + l + (d ? '  ' + d : '')); } else { fail++; lines.push('FAIL  ' + l + (d ? '  ' + d : '')); } };
const guard = (fn) => { try { fn(); return null; } catch (e) { return e.message; } };

if (!location.search.includes('run=1')) {
  out.innerHTML = '<div class="dim">inert — add ?run=1</div>'; document.body.dataset.result = 'IDLE';
} else {
  // 1. exactness
  const three = distribute(100, [{key:'a',bps:3333},{key:'b',bps:3333},{key:'c',bps:3334}]);
  check('100c in three parts sums to 100', three.rows.reduce((n,r)=>n+r.amount,0) === 100, three.rows.map(r=>r.amount).join('/'));
  check('the odd cent goes to the largest remainder', three.rows[2].amount === 34, three.rows.map(r=>r.amount).join('/'));

  let worst = 0, trials = 0;
  const sets = [
    DEFAULT_SPLIT,
    [{key:'a',bps:5000},{key:'b',bps:5000}],
    [{key:'a',bps:3333},{key:'b',bps:3333},{key:'c',bps:3334}],
    [{key:'a',bps:1},{key:'b',bps:9999}],
    [{key:'a',bps:2500},{key:'b',bps:2500},{key:'c',bps:2500},{key:'d',bps:2500}]
  ];
  for (const shares of sets) {
    for (let total = 0; total < 2000; total += 7) {
      const s = distribute(total, shares);
      const sum = s.rows.reduce((n,r)=>n+r.amount,0);
      trials++;
      if (sum !== total) worst++;
    }
  }
  check('parts always equal the whole', worst === 0, trials + ' totals tested, ' + worst + ' losses');

  // 2. validation
  check('shares must sum to 10000', !!guard(() => validateShares([{key:'a',bps:5000}])), guard(() => validateShares([{key:'a',bps:5000}])));
  check('negative bps refused', !!guard(() => validateShares([{key:'a',bps:-1},{key:'b',bps:10001}])));
  check('non-integer cents refused', !!guard(() => distribute(10.5, DEFAULT_SPLIT)));
  check('negative total refused', !!guard(() => distribute(-1, DEFAULT_SPLIT)));
  check('default split is 100%', guard(() => validateShares(DEFAULT_SPLIT)) === null, DEFAULT_SPLIT.map(s=>s.bps).join('+'));

  // 3. the worked example a buyer will actually see
  const sale = distribute(4500, DEFAULT_SPLIT); // $45.00
  const by = Object.fromEntries(sale.rows.map(r => [r.key, r.amount]));
  check('$45 maker share is $36.00', by.maker === 3600, money(by.maker));
  check('$45 platform share is $5.40', by.platform === 540, money(by.platform));
  check('$45 well is $2.25', by.well === 225, money(by.well));
  check('$45 storyteller is $1.35', by.storyteller === 135, money(by.storyteller));

  // 4. combining lines
  const combined = combine([distribute(4500, DEFAULT_SPLIT), distribute(2900, DEFAULT_SPLIT)]);
  check('two lines combine exactly', combined.total === 7400 && combined.rows.reduce((n,r)=>n+r.amount,0) === 7400,
    money(combined.total));

  // 5. and it renders on the receipt (account first — becomeCreator needs a signed-in buyer)
  const seedBuyer = { id: 'EH-SPLIT-1', name: 'Mark Test', email: 'm@t', phone: '+61 0', password: 'x' };
  localStorage.setItem('eh_registered_buyers_dir', JSON.stringify({ 'm@t': seedBuyer }));
  localStorage.setItem('eh_sanctum_buyer_account', JSON.stringify(seedBuyer));
  const cr = await window.EpinoiaAccount.becomeCreator('mark-maker');
  const listing = { id:'split-p', title:'Split Pendant', price:45, split: DEFAULT_SPLIT,
    provenance:{ root:'0x'+'cd'.repeat(32), facets:{who:'M',what:'p',when:'2026-10-25',why:'t',where:'h',how:'x'}, missing:[] },
    owner: cr.id, creatorHandle:'mark-maker' };
  const proof = await window.EpinoiaAccount.sign(listing);
  const signed = { ...listing, signature: proof };
  localStorage.setItem('eh_vault_orders', JSON.stringify([{ invoiceId:'INV-SPLIT-1', date:'2026-10-25', buyerName:'Mark', buyerEmail:'m@t',
    paymentMethod:'bank', items:[{ ...signed, qty:1 }], total:45,
    proofs:[{ id:signed.id, title:signed.title, root:signed.provenance.root, signedBy:proof.did, maker:'mark-maker', listing:signed }] }]));

  const frame = document.getElementById('rcpt');
  await new Promise(r => { frame.onload = r; frame.src = '/store/receipt.html?id=INV-SPLIT-1'; setTimeout(r, 9000); });
  const d = frame.contentDocument;
  const h = d ? d.documentElement.innerHTML : '';
  check('receipt shows the split panel', h.includes('Where the money goes'));
  check('maker share printed', h.includes('$36.00'));
  check('platform share printed', h.includes('$5.40'));
  check('split total printed', h.includes('$45.00'));

  out.innerHTML = lines.map(l => '<div class="' + (l.startsWith('PASS') ? 'pass' : 'fail') + '">' + l.replace(/</g,'&lt;') + '</div>').join('')
    + '<div class="' + (fail ? 'fail' : 'dim') + '" style="margin-top:.6rem">' + pass + ' passed, ' + fail + ' failed</div>';
  document.body.dataset.result = fail ? 'FAIL' : 'PASS';
}
</script>
</body></html>
